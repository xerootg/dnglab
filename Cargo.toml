[workspace]
members = [
	"bin/dnglab",
	"rawler",
	"embedftp",
	"dnglab-py",
	"dnglab-ffi",
]
resolver = "2"


[profile.bench]
opt-level = 3
overflow-checks = false
debug = 0
lto = false

[profile.release]
opt-level = 3
overflow-checks = false
debug = 0
#lto = "fat"

# Profile for the dnglab-ffi static library embedded in mobile apps:
# release speed, smaller binaries (thin LTO, no debug info).
[profile.android]
inherits = "release"
lto = "thin"
strip = "debuginfo"
